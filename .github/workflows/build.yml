name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl1-mesa-dev

      - name: Run DSP tests
        if: runner.os != 'Windows'
        run: |
          g++ -std=c++17 -O2 -o test_limiter Tests/test_limiter.cpp
          ./test_limiter

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=OFF
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AudioLimiter-VST3-${{ matrix.name }}
          path: build/AudioLimiter_artefacts/**/VST3/**
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: AudioLimiter-Standalone-${{ matrix.name }}
          path: build/AudioLimiter_artefacts/**/Standalone/**
          if-no-files-found: warn
